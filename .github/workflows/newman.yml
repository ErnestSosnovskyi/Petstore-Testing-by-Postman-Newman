name: Postman API Tests CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    test-api:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
            - name: Install dependencies
              run: npm ci
            - name: Create directory for test results
              run: mkdir -p testResults
            - name: Run Petstore collection
              run: npm run test:petstore
            - name: Start Mock API Server and Run Store tests
              if: success() || failure()
              run: |
                npm run turn-on-api &
                npx wait-on http://localhost:3000/products
                npm run test:store
            - name: Create Index page
              if: always()
              run: |
                echo "<h1>API Test Reports</h1><br><a href='petstore-report.html'>Petstore Report</a><br><a href='store-report.html'>Store Report</a>" > testResults/index.html
            - name: Deploy report to GitHub Pages
              if: always()
              uses: peaceiris/actions-gh-pages@v4
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./testResults